<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Flujo de Caja Diario — Multigrupo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --surface-1:#fcfcfb; --page:#f4f4f2; --primary:#0b0b0b; --secondary:#52514e;
    --muted:#898781; --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    --blue:#2a78d6; --blue-dark:#184f95; --red:#e34948; --red-dark:#9c2524;
    --green:#0ca30c; --orange:#eb6834; --aqua:#1baf7a; --yellow:#eda100;
    --violet:#4a3aa7; --magenta:#e87ba4;
    --radius:10px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--primary);font-size:14px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- layout ---- */
  header.topbar{background:var(--primary);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header.topbar .brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;}
  header.topbar .brand .badge{background:var(--blue);color:#fff;font-size:11px;padding:2px 8px;border-radius:100px;font-weight:600;}
  header.topbar .userbox{display:flex;align-items:center;gap:12px;font-size:13px;}
  header.topbar .userbox .who{opacity:.85;}
  header.topbar button.logout{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:8px;}
  header.topbar button.logout:hover{background:rgba(255,255,255,.1);}

  nav.tabs{background:var(--surface-1);border-bottom:1px solid var(--grid);display:flex;gap:4px;padding:0 16px;overflow-x:auto;}
  nav.tabs a{padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--secondary);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;}
  nav.tabs a.active{color:var(--blue);border-bottom-color:var(--blue);}
  nav.tabs a:hover{color:var(--primary);}

  main{flex:1;padding:20px;max-width:1280px;margin:0 auto;width:100%;}
  .card{background:var(--surface-1);border:1px solid var(--grid);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .card h2{margin:0 0 4px;font-size:16px;}
  .card .sub{color:var(--secondary);font-size:12.5px;margin-bottom:14px;}

  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .col{flex:1;min-width:220px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--secondary);margin-bottom:4px;}
  input[type=text],input[type=date],input[type=email],input[type=password],input[type=number],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--grid);border-radius:8px;background:#fff;color:var(--primary);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue);}
  textarea{resize:vertical;min-height:60px;}
  .field{margin-bottom:12px;}

  .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--grid);background:#fff;font-weight:600;font-size:13.5px;color:var(--primary);}
  .btn:hover{background:#f5f5f4;}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.primary:hover{background:var(--blue-dark);}
  .btn.danger{background:#fff;border-color:var(--red);color:var(--red-dark);}
  .btn.danger:hover{background:#fdeceb;}
  .btn.sm{padding:5px 10px;font-size:12px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:700;}
  .pill.ingreso{background:#e7f0fb;color:var(--blue-dark);}
  .pill.gasto{background:#fbe9e8;color:var(--red-dark);}
  .pill.traslado_salida,.pill.traslado_entrada{background:#f1ecfc;color:var(--violet);}
  .pill.prestamo_empleado{background:#fdf1e2;color:#9a5a10;}
  .pill.pendiente{background:#fdf1e2;color:#9a5a10;}
  .pill.pagado_parcial{background:#fdf6df;color:#8a6d00;}
  .pill.pagado{background:#e6f7ea;color:#0a6e0a;}
  .pill.on{background:#e6f7ea;color:#0a6e0a;}
  .pill.off{background:#f1f0ee;color:var(--secondary);}
  .muted{color:var(--muted);font-size:12.5px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  table th{text-align:left;color:var(--secondary);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--grid);}
  table td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle;}
  table tbody tr:hover{background:#f9f9f8;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .tablewrap{overflow-x:auto;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--surface-1);border:1px solid var(--grid);border-radius:var(--radius);padding:16px;}
  .kpi .label{font-size:12px;color:var(--secondary);font-weight:600;margin-bottom:6px;}
  .kpi .value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .kpi .value.pos{color:var(--blue-dark);}
  .kpi .value.neg{color:var(--red-dark);}

  .charts-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:900px){.charts-grid.two{grid-template-columns:1fr 1fr;}}
  .chart-box{position:relative;height:280px;}
  .legend{display:flex;gap:16px;font-size:12.5px;color:var(--secondary);margin-top:6px;flex-wrap:wrap;}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:380px;background:var(--surface-1);border:1px solid var(--grid);border-radius:14px;padding:32px;}
  .login-card h1{font-size:19px;margin:0 0 4px;}
  .login-card .sub{color:var(--secondary);font-size:13px;margin-bottom:22px;}
  .login-card .btn.primary{width:100%;padding:11px;font-size:14px;margin-top:6px;}
  .error-box{background:#fdeceb;color:var(--red-dark);border:1px solid #f4c6c3;border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:14px;}

  .toast-wrap{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:999;}
  .toast{background:var(--primary);color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:320px;}
  .toast.err{background:var(--red-dark);}
  .toast.ok{background:#0a6e0a;}

  .centro-checklist{border:1px solid var(--grid);border-radius:8px;padding:6px 10px;max-height:160px;overflow-y:auto;background:#fff;min-width:180px;}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .subtabs button{padding:7px 14px;border-radius:100px;border:1px solid var(--grid);background:#fff;font-size:12.5px;font-weight:600;color:var(--secondary);}
  .subtabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .modal-overlay{position:fixed;inset:0;background:rgba(11,11,11,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:998;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

  .empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center;}
  .footer-note{color:var(--muted);font-size:11.5px;text-align:center;padding:18px 0 8px;}
  .scope-note{font-size:12px;color:var(--secondary);background:#f1f0ee;border-radius:8px;padding:7px 11px;margin-bottom:14px;display:inline-block;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://zmgitsmngdjpacvrxfkx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptZ2l0c21uZ2RqcGFjdnJ4Zmt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNzE5MzUsImV4cCI6MjA5ODk0NzkzNX0.8ZcQB0LCbClGtoPnIXqAT5NAzb4b6CKEcO8TzyKm2c0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================= STATE ================= */
let currentUser = null;   // {id,nombre,email,rol,pdv_id}
let CAT = { pdvs: [], centros: [], conceptos: [], usuarios: [], conceptoCentros: [], cuentasPendientes: [] };
let charts = {}; // chart.js instances keyed by canvas id

/* ================= HELPERS ================= */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatCOP(n){
  const v = Number(n) || 0;
  return v.toLocaleString('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0});
}
function formatDate(d){
  if(!d) return "";
  const dt = (d instanceof Date) ? d : new Date(d + "T00:00:00");
  return dt.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
}
function addDaysISO(iso, days){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function firstOfMonthISO(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
}
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function toast(msg, type="ok"){
  const wrap = $('#toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type === 'err' ? 'err' : 'ok');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
function isAdmin(){ return currentUser && currentUser.rol === 'admin'; }
function canEdit(){ return currentUser && (currentUser.rol === 'admin' || currentUser.rol === 'editor'); }
// PDV ids this user may see/act on; null = all
function allowedPdvIds(){
  if(!currentUser || !currentUser.pdv_id) return null;
  return [currentUser.pdv_id];
}
function pdvName(id){ const p = CAT.pdvs.find(x=>x.id===id); return p ? p.nombre : '—'; }
function centroName(id){ const c = CAT.centros.find(x=>x.id===id); return c ? c.nombre : '—'; }
function conceptoName(id){ const c = CAT.conceptos.find(x=>x.id===id); return c ? c.nombre : '—'; }
function usuarioName(id){ const u = CAT.usuarios.find(x=>x.id===id); return u ? u.nombre : '—'; }
// Centros de costo asociados a un concepto (relación muchos-a-muchos)
function centrosDeConcepto(conceptoId){
  const ids = CAT.conceptoCentros.filter(x=>x.concepto_id===conceptoId).map(x=>x.centro_costo_id);
  return CAT.centros.filter(c => ids.includes(c.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
}
function cuentaPendiente(id){ return CAT.cuentasPendientes.find(x=>x.id===id) || null; }
const TIPO_LABEL = {
  ingreso: 'Ingreso', gasto: 'Salida',
  traslado_salida: 'Traslado (salida)', traslado_entrada: 'Traslado (entrada)',
  prestamo_empleado: 'Préstamo a empleado',
};
// Etiqueta de "concepto" para movimientos que no pertenecen al catálogo de rubros
// (traslados, préstamos entregados, y abonos/cobros ligados a una cuenta pendiente).
// Devuelve texto sin escapar, igual que conceptoName/pdvName — el llamador aplica escapeHtml().
function movLabel(m){
  if(m.concepto_id) return conceptoName(m.concepto_id);
  if(m.tipo === 'traslado_salida') return `Traslado → ${pdvName(m.pdv_destino_id)}`;
  if(m.tipo === 'traslado_entrada') return `Traslado ← ${pdvName(m.pdv_destino_id)}`;
  if(m.cuenta_pendiente_id){
    const cp = cuentaPendiente(m.cuenta_pendiente_id);
    if(cp) return m.tipo === 'prestamo_empleado'
      ? `Préstamo a ${cp.deudor}`
      : `Abono: ${cp.deudor} (${cp.tipo==='prestamo_empleado'?'préstamo':'cuenta por cobrar'})`;
  }
  return '—';
}

/* ================= SESSION ================= */
function saveSession(u){ localStorage.setItem('caja_session', JSON.stringify(u)); }
function loadSessionFromStorage(){
  try{ const raw = localStorage.getItem('caja_session'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){ localStorage.removeItem('caja_session'); }

/* ================= DATA LAYER ================= */
async function loadCatalogos(){
  const [pdvs, centros, conceptos, usuarios, conceptoCentros, cuentasPendientes] = await Promise.all([
    db.from('caja_pdv').select('*').order('nombre'),
    db.from('caja_centros_costo').select('*').order('nombre'),
    db.from('caja_conceptos').select('*').order('nombre'),
    db.from('caja_usuarios').select('id,nombre,email,rol,pdv_id,activo,created_at').order('nombre'),
    db.from('caja_concepto_centro_costo').select('*'),
    db.from('caja_cuentas_pendientes').select('*').order('fecha', {ascending:false}),
  ]);
  if(pdvs.error || centros.error || conceptos.error || usuarios.error || conceptoCentros.error || cuentasPendientes.error){
    console.error(pdvs.error||centros.error||conceptos.error||usuarios.error||conceptoCentros.error||cuentasPendientes.error);
    toast('No se pudieron cargar los catálogos. Revisa tu conexión.', 'err');
    return;
  }
  CAT.pdvs = pdvs.data; CAT.centros = centros.data; CAT.conceptos = conceptos.data; CAT.usuarios = usuarios.data;
  CAT.conceptoCentros = conceptoCentros.data; CAT.cuentasPendientes = cuentasPendientes.data;
}

// Cuenta cuántos movimientos referencian un registro de catálogo (bloquea el borrado si hay historial)
async function countMovimientosPor(campo, id){
  const { count, error } = await db.from('caja_movimientos').select('id', { count: 'exact', head: true }).eq(campo, id);
  if(error){ console.error(error); return -1; }
  return count ?? 0;
}

async function fetchMovimientos(filters){
  let q = db.from('caja_movimientos').select('*').order('fecha', {ascending:true});
  if(filters.desde) q = q.gte('fecha', filters.desde);
  if(filters.hasta) q = q.lte('fecha', filters.hasta);
  if(filters.pdv_id) q = q.eq('pdv_id', filters.pdv_id);
  if(filters.tipo) q = q.eq('tipo', filters.tipo);
  if(filters.concepto_id) q = q.eq('concepto_id', filters.concepto_id);
  if(filters.centro_costo_id) q = q.eq('centro_costo_id', filters.centro_costo_id);
  const scoped = allowedPdvIds();
  if(scoped && !filters.pdv_id) q = q.in('pdv_id', scoped);
  const { data, error } = await q;
  if(error){ console.error(error); toast('Error cargando movimientos.', 'err'); return []; }
  return data;
}

// Efecto de cada tipo de movimiento sobre el efectivo físico de una caja.
// cuenta_por_cobrar no genera fila en caja_movimientos (no hay salida de efectivo al registrarla).
const SALDO_SIGNO = { ingreso: 1, gasto: -1, traslado_salida: -1, traslado_entrada: 1, prestamo_empleado: -1 };

// balance acumulado desde el inicio de los tiempos hasta 'hastaISO' (inclusive), por pdv_id o general si pdv_id es null
async function saldoAcumuladoAlCorte(hastaISO, pdvId){
  let q = db.from('caja_movimientos').select('tipo,monto').lte('fecha', hastaISO);
  if(pdvId) q = q.eq('pdv_id', pdvId);
  else { const scoped = allowedPdvIds(); if(scoped) q = q.in('pdv_id', scoped); }
  const { data, error } = await q;
  if(error){ console.error(error); return 0; }
  return data.reduce((acc,m) => acc + (SALDO_SIGNO[m.tipo] || 0) * Number(m.monto), 0);
}

// arqueo de caja: saldo físico contado, guardado por PDV + fecha de corte
async function fetchSaldoFisico(pdvId, fechaISO){
  const { data, error } = await db.from('caja_saldo_fisico').select('*').eq('pdv_id', pdvId).eq('fecha', fechaISO).maybeSingle();
  if(error){ console.error(error); return null; }
  return data;
}

/* ================= ROUTER ================= */
const ROUTES = {
  '#/login': renderLogin,
  '#/dashboard': renderDashboard,
  '#/registro': renderRegistro,
  '#/historial': renderHistorial,
  '#/pendientes': renderPendientes,
  '#/catalogos': renderCatalogos,
  '#/usuarios': renderUsuarios,
  '#/cuenta': renderCuenta,
};

async function route(){
  const hash = location.hash || '#/dashboard';
  if(!currentUser){
    if(hash !== '#/login'){ location.hash = '#/login'; return; }
    renderLogin();
    return;
  }
  if(hash === '#/login'){ location.hash = '#/dashboard'; return; }
  // gate admin-only / editor-only routes
  if((hash === '#/catalogos' || hash === '#/usuarios') && !isAdmin()){
    location.hash = '#/dashboard'; return;
  }
  if(hash === '#/registro' && !canEdit()){
    location.hash = '#/dashboard'; return;
  }
  const view = ROUTES[hash] || renderDashboard;
  renderShell(hash);
  await view();
}
window.addEventListener('hashchange', route);

/* ================= SHELL / NAV ================= */
function renderShell(activeHash){
  const app = $('#app');
  const tabs = [
    {href:'#/dashboard', label:'Dashboard', show:true},
    {href:'#/registro', label:'Registrar movimiento', show:canEdit()},
    {href:'#/historial', label:'Historial', show:true},
    {href:'#/pendientes', label:'Cuentas y préstamos', show:true},
    {href:'#/catalogos', label:'Catálogos', show:isAdmin()},
    {href:'#/usuarios', label:'Usuarios', show:isAdmin()},
    {href:'#/cuenta', label:'Mi cuenta', show:true},
  ].filter(t=>t.show);

  const scopeLabel = currentUser.pdv_id ? pdvName(currentUser.pdv_id) : 'Todos los PDV';

  app.innerHTML = `
    <header class="topbar">
      <div class="brand">Flujo de Caja <span class="badge">Multigrupo</span></div>
      <div class="userbox">
        <span class="who">${escapeHtml(currentUser.nombre)} · ${roleLabel(currentUser.rol)} · ${escapeHtml(scopeLabel)}</span>
        <button class="logout" id="btnLogout">Cerrar sesión</button>
      </div>
    </header>
    <nav class="tabs" id="navTabs">
      ${tabs.map(t => `<a href="${t.href}" class="${t.href===activeHash?'active':''}">${t.label}</a>`).join('')}
    </nav>
    <main id="main"></main>
    <div class="footer-note">Flujo de Caja Diario · Multigrupo © ${new Date().getFullYear()}</div>
  `;
  $('#btnLogout').addEventListener('click', () => { clearSession(); currentUser=null; location.hash='#/login'; });
}
function roleLabel(r){ return {admin:'Administrador', editor:'Registro y edición', viewer:'Visualización'}[r] || r; }

/* ================= LOGIN ================= */
function renderLogin(){
  const app = $('#app');
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Flujo de Caja Diario</h1>
        <div class="sub">Multigrupo — inicia sesión para continuar</div>
        <div id="loginError"></div>
        <form id="loginForm">
          <div class="field">
            <label>Correo</label>
            <input type="email" id="loginEmail" required autocomplete="username">
          </div>
          <div class="field">
            <label>Contraseña</label>
            <input type="password" id="loginPassword" required autocomplete="current-password">
          </div>
          <button class="btn primary" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
  `;
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#loginEmail').value.trim().toLowerCase();
    const password = $('#loginPassword').value;
    const errBox = $('#loginError');
    errBox.innerHTML = '';
    const btn = $('#loginForm button[type=submit]');
    btn.disabled = true; btn.textContent = 'Ingresando…';
    try{
      const { data, error } = await db.from('caja_usuarios').select('*').eq('email', email).eq('activo', true).maybeSingle();
      if(error) throw error;
      if(!data){ throw new Error('Usuario no encontrado o inactivo.'); }
      const hash = await sha256Hex(password);
      if(hash !== data.password_hash){ throw new Error('Contraseña incorrecta.'); }
      currentUser = { id:data.id, nombre:data.nombre, email:data.email, rol:data.rol, pdv_id:data.pdv_id };
      saveSession(currentUser);
      await loadCatalogos();
      location.hash = '#/dashboard';
      route();
    }catch(err){
      errBox.innerHTML = `<div class="error-box">${escapeHtml(err.message || 'No se pudo iniciar sesión.')}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  });
}

/* ================= DASHBOARD ================= */
let dashFilters = { preset:'mes', desde: firstOfMonthISO(), hasta: todayISO(), pdv_id:'', centro_costo_id:'' };

async function renderDashboard(){
  const main = $('#main');
  const scoped = allowedPdvIds();

async function loadDashboardData(){
  const body = $('#dashBody');
  body.innerHTML = `<div class="empty">Cargando…</div>`;

  const movs = await fetchMovimientos({ desde: dashFilters.desde, hasta: dashFilters.hasta, pdv_id: dashFilters.pdv_id || null, centro_costo_id: dashFilters.centro_costo_id || null });

  const ingresos = movs.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+Number(m.monto),0);
  const gastos = movs.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+Number(m.monto),0);
  const neto = ingresos - gastos;
  // El teórico/físico de arqueo siempre refleja la caja completa del PDV, sin filtrar por centro de costos
  const saldoCorte = await saldoAcumuladoAlCorte(dashFilters.hasta, dashFilters.pdv_id || null);
  const saldoFisicoRow = dashFilters.pdv_id ? await fetchSaldoFisico(dashFilters.pdv_id, dashFilters.hasta) : null;
  const fisico = saldoFisicoRow ? Number(saldoFisicoRow.saldo_fisico) : null;
  const diff = fisico === null ? null : (fisico - saldoCorte);

  body.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Ingresos del periodo</div><div class="value pos">${formatCOP(ingresos)}</div></div>
      <div class="kpi"><div class="label">Salidas del periodo</div><div class="value neg">${formatCOP(gastos)}</div></div>
      <div class="kpi"><div class="label">Saldo neto del periodo</div><div class="value ${neto>=0?'pos':'neg'}">${formatCOP(neto)}</div></div>
      <div class="kpi"><div class="label">Saldo de caja acumulado (al corte)</div><div class="value ${saldoCorte>=0?'pos':'neg'}">${formatCOP(saldoCorte)}</div></div>
    </div>

    <div class="card">
      <h2>Arqueo de caja</h2>
      ${dashFilters.pdv_id ? `
      <div class="sub">Saldo teórico (calculado) vs. el conteo físico real al corte del ${formatDate(dashFilters.hasta)} — ${escapeHtml(pdvName(dashFilters.pdv_id))}. No se filtra por centro de costos: refleja la caja completa de ese PDV.</div>
      <div class="row" style="align-items:flex-end;">
        <div class="col" style="max-width:220px;">
          <label>Saldo teórico (calculado)</label>
          <input type="text" value="${formatCOP(saldoCorte)}" disabled>
        </div>
        <div class="col" style="max-width:220px;">
          <label>Saldo disponible físico</label>
          <input type="number" id="fisicoInput" step="1" placeholder="0" value="${fisico===null?'':fisico}" ${canEdit()?'':'disabled'}>
        </div>
        ${canEdit() ? `<div class="col" style="max-width:160px;"><button class="btn primary" id="fisicoSave" style="width:100%;">Guardar físico</button></div>` : ''}
      </div>
      <div class="kpis" style="margin-top:14px;margin-bottom:0;">
        <div class="kpi">
          <div class="label">Comparativo Teórico vs. Físico</div>
          <div class="value ${diff===null?'':(diff===0?'pos':(diff>0?'pos':'neg'))}">${diff===null ? '— (sin conteo físico registrado)' : (diff===0?'Cuadra exacto':`${formatCOP(Math.abs(diff))} ${diff>0?'sobrante':'faltante'}`)}</div>
        </div>
      </div>
      ` : `<div class="sub">Selecciona un punto de venta específico arriba (no "Todos") para registrar y comparar el conteo físico de esa caja.</div>`}
    </div>

    <div class="card">
      <h2>Saldo diario</h2>
      <div class="sub">Movimiento neto por día y saldo acumulado en el periodo seleccionado</div>
      <div class="chart-box"><canvas id="chartSaldoDiario"></canvas></div>
    </div>

    <div class="charts-grid two">
      <div class="card">
        <h2>Salidas por rubro / concepto</h2>
        <div class="sub">Total de salidas en el periodo, por concepto</div>
        <div class="chart-box"><canvas id="chartGastoConcepto"></canvas></div>
      </div>
      <div class="card">
        <h2>Ingresos y salidas por centro de costos</h2>
        <div class="chart-box"><canvas id="chartCentroCosto"></canvas></div>
      </div>
    </div>

    <div class="card">
      <h2>Comparativo por punto de venta</h2>
      <div class="sub">${dashFilters.pdv_id ? 'Filtro de PDV activo arriba — quita el filtro para comparar entre tiendas.' : 'Ingresos, salidas y saldo neto por PDV en el periodo'}</div>
      <div class="chart-box"><canvas id="chartPorPdv"></canvas></div>
    </div>
  `;

  if(canEdit() && dashFilters.pdv_id && $('#fisicoSave')){
    $('#fisicoSave').addEventListener('click', async () => {
      const val = $('#fisicoInput').value;
      if(val === ''){ toast('Escribe un valor de saldo físico.', 'err'); return; }
      const monto = Number(val);
      if(!Number.isFinite(monto)){ toast('Valor inválido.', 'err'); return; }
      const btn = $('#fisicoSave');
      btn.disabled = true; btn.textContent = 'Guardando…';
      const { error } = await db.from('caja_saldo_fisico').upsert({
        pdv_id: dashFilters.pdv_id,
        fecha: dashFilters.hasta,
        saldo_fisico: monto,
        usuario_id: currentUser.id,
        updated_at: new Date().toISOString(),
      }, { onConflict: 'pdv_id,fecha' });
      btn.disabled = false; btn.textContent = 'Guardar físico';
      if(error){ console.error(error); toast('No se pudo guardar el saldo físico.', 'err'); return; }
      toast('Saldo físico guardado.', 'ok');
      loadDashboardData();
    });
  }

  drawSaldoDiario(movs);
  drawGastoConcepto(movs);
  drawCentroCosto(movs);
  await drawPorPdv();
}

function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function drawSaldoDiario(movs){
  destroyChart('chartSaldoDiario');
  const byDay = {};
  let d = dashFilters.desde;
  while(d <= dashFilters.hasta){ byDay[d] = 0; d = addDaysISO(d,1); }
  movs.forEach(m => { byDay[m.fecha] = (byDay[m.fecha]||0) + (m.tipo==='ingreso'?Number(m.monto):-Number(m.monto)); });
  const days = Object.keys(byDay).sort();
  let running = 0;
  const acumulado = days.map(day => { running += byDay[day]; return running; });
  const ctx = $('#chartSaldoDiario').getContext('2d');
  charts.chartSaldoDiario = new Chart(ctx, {
    data: {
      labels: days.map(d=>formatDate(d)),
      datasets: [
        { type:'bar', label:'Movimiento neto del día', data: days.map(d=>byDay[d]),
          backgroundColor: days.map(d=> byDay[d]>=0 ? 'rgba(42,120,214,0.55)' : 'rgba(227,73,72,0.55)'),
          borderRadius:3, order:2 },
        { type:'line', label:'Saldo acumulado', data: acumulado, borderColor:'#4a3aa7', backgroundColor:'#4a3aa7',
          borderWidth:2, pointRadius:2, tension:0.15, order:1 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales:{ y:{ ticks:{ callback:v=>formatCOP(v) }, grid:{color:'#e1e0d9'} }, x:{ grid:{display:false} } },
      plugins:{ legend:{ position:'bottom', labels:{boxWidth:10} },
        tooltip:{ callbacks:{ label: (c)=> `${c.dataset.label}: ${formatCOP(c.raw)}` } } }
    }
  });
}

function drawGastoConcepto(movs){
  destroyChart('chartGastoConcepto');
  const gastos = movs.filter(m=>m.tipo==='gasto');
  const totals = {};
  gastos.forEach(m => { totals[m.concepto_id] = (totals[m.concepto_id]||0) + Number(m.monto); });
  const rows = Object.entries(totals).map(([id,total])=>({name:conceptoName(id), total}))
    .sort((a,b)=>b.total-a.total).slice(0,10);
  const ctx = $('#chartGastoConcepto').getContext('2d');
  if(rows.length === 0){ ctx.canvas.parentElement.innerHTML = '<div class="empty">Sin salidas en el periodo</div>'; return; }
  charts.chartGastoConcepto = new Chart(ctx, {
    type:'bar',
    data:{ labels: rows.map(r=>r.name), datasets:[{ label:'Salida', data: rows.map(r=>r.total), backgroundColor:'#e34948', borderRadius:3 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      scales:{ x:{ ticks:{ callback:v=>formatCOP(v) }, grid:{color:'#e1e0d9'} }, y:{ grid:{display:false} } },
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=>formatCOP(c.raw) } } } }
  });
}

function drawCentroCosto(movs){
  destroyChart('chartCentroCosto');
  const ingXCentro = {}, gasXCentro = {};
  movs.forEach(m => {
    const bucket = m.tipo==='ingreso' ? ingXCentro : gasXCentro;
    bucket[m.centro_costo_id] = (bucket[m.centro_costo_id]||0) + Number(m.monto);
  });
  const ids = Array.from(new Set([...Object.keys(ingXCentro), ...Object.keys(gasXCentro)]));
  const names = ids.map(centroName);
  const ctx = $('#chartCentroCosto').getContext('2d');
  if(ids.length === 0){ ctx.canvas.parentElement.innerHTML = '<div class="empty">Sin movimientos en el periodo</div>'; return; }
  charts.chartCentroCosto = new Chart(ctx, {
    type:'bar',
    data:{ labels: names, datasets:[
      { label:'Ingresos', data: ids.map(id=>ingXCentro[id]||0), backgroundColor:'#2a78d6', borderRadius:3 },
      { label:'Salidas', data: ids.map(id=>gasXCentro[id]||0), backgroundColor:'#e34948', borderRadius:3 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y:{ ticks:{ callback:v=>formatCOP(v) }, grid:{color:'#e1e0d9'} }, x:{ grid:{display:false} } },
      plugins:{ legend:{ position:'bottom', labels:{boxWidth:10} }, tooltip:{ callbacks:{ label:(c)=>`${c.dataset.label}: ${formatCOP(c.raw)}` } } } }
  });
}

async function drawPorPdv(){
  destroyChart('chartPorPdv');
  const scoped = allowedPdvIds();
  const pdvsToShow = CAT.pdvs.filter(p => p.activo && (!scoped || scoped.includes(p.id)) && (!dashFilters.pdv_id || p.id === dashFilters.pdv_id));
  const ing = [], gas = [];
  for(const p of pdvsToShow){
    const movs = await fetchMovimientos({ desde: dashFilters.desde, hasta: dashFilters.hasta, pdv_id: p.id, centro_costo_id: dashFilters.centro_costo_id || null });
    ing.push(movs.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+Number(m.monto),0));
    gas.push(movs.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+Number(m.monto),0));
  }
  const ctx = $('#chartPorPdv').getContext('2d');
  if(pdvsToShow.length === 0){ ctx.canvas.parentElement.innerHTML = '<div class="empty">No hay PDV para comparar</div>'; return; }
  charts.chartPorPdv = new Chart(ctx, {
    type:'bar',
    data:{ labels: pdvsToShow.map(p=>p.nombre), datasets:[
      { label:'Ingresos', data: ing, backgroundColor:'#2a78d6', borderRadius:3 },
      { label:'Salidas', data: gas, backgroundColor:'#e34948', borderRadius:3 },
      { label:'Saldo neto', data: ing.map((v,i)=>v-gas[i]), backgroundColor:'#1baf7a', borderRadius:3 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      scales:{ y:{ ticks:{ callback:v=>formatCOP(v) }, grid:{color:'#e1e0d9'} }, x:{ grid:{display:false} } },
      plugins:{ legend:{ position:'bottom', labels:{boxWidth:10} }, tooltip:{ callbacks:{ label:(c)=>`${c.dataset.label}: ${formatCOP(c.raw)}` } } } }
  });
}

async function renderRegistro(){
  const main = $('#main');
  const scoped = allowedPdvIds();
  const pdvOptions = CAT.pdvs.filter(p=>p.activo && (!scoped || scoped.includes(p.id)));

  main.innerHTML = `
    <div class="card">
      <h2>Registrar movimiento</h2>
      <div class="sub">Ingreso o salida de dinero de caja</div>
      <form id="movForm" novalidate>
        <div class="row">
          <div class="col">
            <label>Fecha</label>
            <input type="date" id="mFecha" value="${todayISO()}" required>
          </div>
          <div class="col">
            <label>Tipo</label>
            <select id="mTipo" required>
              <option value="ingreso">Ingreso</option>
              <option value="gasto">Salida</option>
              <option value="traslado">Traslado entre almacenes</option>
            </select>
          </div>
          <div class="col">
            <label id="mPdvLabel">Punto de venta</label>
            <select id="mPdv" required ${scoped ? 'disabled' : ''}>
              ${pdvOptions.map(p=>`<option value="${p.id}" ${scoped && scoped[0]===p.id ? 'selected':''}>${escapeHtml(p.nombre)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="row" id="mDestinoRow" style="display:none;">
          <div class="col">
            <label>Hacia (PDV destino)</label>
            <select id="mPdvDestino"></select>
          </div>
        </div>
        <div class="row" id="mConceptoRow">
          <div class="col">
            <label>Concepto / rubro</label>
            <select id="mConcepto" required></select>
          </div>
          <div class="col">
            <label>Centro de costos</label>
            <select id="mCentro" required></select>
          </div>
          <div class="col">
            <label>Monto (COP)</label>
            <input type="number" id="mMonto" min="1" step="1" required placeholder="0">
          </div>
        </div>
        <div class="row" id="mMontoTrasladoRow" style="display:none;">
          <div class="col" style="max-width:220px;">
            <label>Monto (COP)</label>
            <input type="number" id="mMontoTraslado" min="1" step="1" placeholder="0">
          </div>
        </div>
        <div class="row">
          <div class="col">
            <label>Número de documento (opcional)</label>
            <input type="text" id="mNumDoc" placeholder="Ej. factura, recibo, comprobante…">
          </div>
        </div>
        <div class="field">
          <label>Descripción (opcional)</label>
          <textarea id="mDesc" placeholder="Detalle del movimiento…"></textarea>
        </div>
        <button class="btn primary" type="submit">Guardar movimiento</button>
      </form>
    </div>
    <div class="card">
      <h2>Registrados hoy</h2>
      <div class="tablewrap"><table id="hoyTable"><thead><tr><th>Tipo</th><th>Concepto</th><th>PDV</th><th class="num">Monto</th></tr></thead><tbody></tbody></table></div>
    </div>
  `;

  function refreshConceptoOptions(){
    const tipo = $('#mTipo').value;
    const opts = CAT.conceptos.filter(c=>c.activo && c.tipo===tipo);
    $('#mConcepto').innerHTML = opts.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('');
    updateCentroOptions();
  }
  function updateCentroOptions(){
    const centros = centrosDeConcepto($('#mConcepto').value);
    if(centros.length === 0){
      $('#mCentro').innerHTML = `<option value="">Sin centro de costos asociado</option>`;
    } else {
      $('#mCentro').innerHTML = centros.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('');
    }
  }
  function refreshDestinoOptions(){
    const origenId = $('#mPdv').value;
    const opts = pdvOptions.filter(p=>p.id!==origenId);
    $('#mPdvDestino').innerHTML = opts.map(p=>`<option value="${p.id}">${escapeHtml(p.nombre)}</option>`).join('');
  }
  function onTipoChange(){
    const esTraslado = $('#mTipo').value === 'traslado';
    $('#mDestinoRow').style.display = esTraslado ? '' : 'none';
    $('#mConceptoRow').style.display = esTraslado ? 'none' : '';
    $('#mMontoTrasladoRow').style.display = esTraslado ? '' : 'none';
    $('#mPdvLabel').textContent = esTraslado ? 'Desde (PDV origen)' : 'Punto de venta';
    $('#mConcepto').required = !esTraslado;
    $('#mCentro').required = !esTraslado;
    if(esTraslado) refreshDestinoOptions(); else refreshConceptoOptions();
  }
  $('#mTipo').addEventListener('change', onTipoChange);
  $('#mConcepto').addEventListener('change', updateCentroOptions);
  $('#mPdv').addEventListener('change', () => { if($('#mTipo').value==='traslado') refreshDestinoOptions(); });
  onTipoChange();

  $('#movForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const tipo = $('#mTipo').value;
    const fecha = $('#mFecha').value;
    const numero_documento = $('#mNumDoc').value.trim() || null;
    const descripcion = $('#mDesc').value.trim() || null;
    const btn = $('#movForm button[type=submit]');

    if(tipo === 'traslado'){
      const pdvOrigen = $('#mPdv').value;
      const pdvDestino = $('#mPdvDestino').value;
      const monto = Number($('#mMontoTraslado').value);
      if(!pdvOrigen || !pdvDestino || pdvOrigen === pdvDestino){ toast('Elige un PDV origen y un PDV destino distintos.', 'err'); return; }
      if(!monto || monto <= 0){ toast('El monto debe ser mayor a cero.', 'err'); return; }
      btn.disabled = true; btn.textContent = 'Guardando…';
      const base = { fecha, monto, numero_documento, descripcion, usuario_id: currentUser.id };
      const { data: salida, error: e1 } = await db.from('caja_movimientos')
        .insert({ ...base, tipo:'traslado_salida', pdv_id: pdvOrigen, pdv_destino_id: pdvDestino }).select().single();
      if(e1){ console.error(e1); btn.disabled=false; btn.textContent='Guardar movimiento'; toast('No se pudo registrar el traslado.', 'err'); return; }
      const { data: entrada, error: e2 } = await db.from('caja_movimientos')
        .insert({ ...base, tipo:'traslado_entrada', pdv_id: pdvDestino, pdv_destino_id: pdvOrigen, traslado_par_id: salida.id }).select().single();
      btn.disabled = false; btn.textContent = 'Guardar movimiento';
      if(e2){ console.error(e2); toast('El traslado quedó registrado solo a medias; revísalo en Historial.', 'err'); return; }
      await db.from('caja_movimientos').update({ traslado_par_id: entrada.id }).eq('id', salida.id);
      toast('Traslado registrado.', 'ok');
      $('#movForm').reset();
      $('#mFecha').value = todayISO();
      if(scoped) $('#mPdv').value = scoped[0];
      onTipoChange();
      loadHoy();
      return;
    }

    const concepto = CAT.conceptos.find(c => c.id === $('#mConcepto').value);
    const centroId = $('#mCentro').value;
    if(!concepto){ toast('Selecciona un concepto válido.', 'err'); return; }
    if(!centroId){ toast('Este concepto no tiene un centro de costos asociado. Asígnalo desde Catálogos.', 'err'); return; }
    const payload = {
      fecha,
      tipo,
      concepto_id: concepto.id,
      centro_costo_id: centroId,
      pdv_id: $('#mPdv').value,
      monto: Number($('#mMonto').value),
      numero_documento,
      descripcion,
      usuario_id: currentUser.id,
    };
    if(!payload.monto || payload.monto <= 0){ toast('El monto debe ser mayor a cero.', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Guardando…';
    const { error } = await db.from('caja_movimientos').insert(payload);
    btn.disabled = false; btn.textContent = 'Guardar movimiento';
    if(error){ console.error(error); toast('No se pudo guardar el movimiento.', 'err'); return; }
    toast('Movimiento registrado.', 'ok');
    $('#movForm').reset();
    $('#mFecha').value = todayISO();
    if(scoped) $('#mPdv').value = scoped[0];
    onTipoChange();
    loadHoy();
  });

  loadHoy();
}

async function loadHoy(){
  const movs = await fetchMovimientos({ desde: todayISO(), hasta: todayISO() });
  const tbody = $('#hoyTable tbody');
  if(!tbody) return;
  if(movs.length === 0){ tbody.innerHTML = `<tr><td colspan="4" class="empty">Sin movimientos registrados hoy</td></tr>`; return; }
  tbody.innerHTML = movs.slice().reverse().map(m => `
    <tr>
      <td><span class="pill ${m.tipo}">${TIPO_LABEL[m.tipo] || m.tipo}</span></td>
      <td>${escapeHtml(movLabel(m))}</td>
      <td>${escapeHtml(pdvName(m.pdv_id))}</td>
      <td class="num">${formatCOP(m.monto)}</td>
    </tr>`).join('');
}

async function loadHistorial(){
  const tbody = $('#histTable tbody');

  histCache = await fetchMovimientos(histFilters);
  renderHistTable();
}

function renderHistTable(){
  const tbody = $('#histTable tbody');
  if(!tbody) return;
  if(histCache.length === 0){ tbody.innerHTML = `<tr><td colspan="10" class="empty">Sin movimientos para el filtro seleccionado</td></tr>`; return; }
  tbody.innerHTML = histCache.slice().reverse().map(m => {
    const esSimple = (m.tipo==='ingreso' || m.tipo==='gasto') && !m.cuenta_pendiente_id;
    const esTraslado = m.tipo==='traslado_salida' || m.tipo==='traslado_entrada';
    let acciones = '<span class="muted">—</span>';
    if(canEdit() && esSimple) acciones = `<button class="btn sm" data-edit="${m.id}">Editar</button> <button class="btn sm danger" data-del="${m.id}">Eliminar</button>`;
    else if(canEdit() && esTraslado) acciones = `<button class="btn sm danger" data-del-traslado="${m.id}">Eliminar traslado</button>`;
    else if(m.cuenta_pendiente_id) acciones = `<span class="muted">Ver en Cuentas y préstamos</span>`;
    return `
    <tr>
      <td>${formatDate(m.fecha)}</td>
      <td><span class="pill ${m.tipo}">${TIPO_LABEL[m.tipo] || m.tipo}</span></td>
      <td>${escapeHtml(movLabel(m))}</td>
      <td>${escapeHtml(centroName(m.centro_costo_id))}</td>
      <td>${escapeHtml(pdvName(m.pdv_id))}</td>
      <td class="num">${formatCOP(m.monto)}</td>
      <td>${escapeHtml(m.numero_documento || '—')}</td>
      <td>${escapeHtml(m.descripcion || '—')}</td>
      <td>${escapeHtml(usuarioName(m.usuario_id))}</td>
      ${canEdit() ? `<td>${acciones}</td>` : ''}

  if(canEdit()){
    $$('#histTable [data-edit]').forEach(b => b.addEventListener('click', () => openEditMovModal(b.dataset.edit)));
    $$('#histTable [data-del]').forEach(b => b.addEventListener('click', () => deleteMov(b.dataset.del)));
    $$('#histTable [data-del-traslado]').forEach(b => b.addEventListener('click', () => deleteTraslado(b.dataset.delTraslado)));
  }
}

function openEditMovModal(id){
  const m = histCache.find(x=>x.id===id);
  if(!m) return;
  const scoped = allowedPdvIds();
  const pdvOptions = CAT.pdvs.filter(p=>!scoped || scoped.includes(p.id));
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Editar movimiento</h3>
      <div class="field"><label>Fecha</label><input type="date" id="emFecha" value="${m.fecha}"></div>
      <div class="field"><label>Tipo</label>
        <select id="emTipo"><option value="ingreso" ${m.tipo==='ingreso'?'selected':''}>Ingreso</option><option value="gasto" ${m.tipo==='gasto'?'selected':''}>Salida</option></select>
      </div>
      <div class="field"><label>Concepto</label><select id="emConcepto"></select></div>
      <div class="field"><label>Centro de costos</label><select id="emCentro"></select></div>
      <div class="field"><label>Punto de venta</label>
        <select id="emPdv">${pdvOptions.map(p=>`<option value="${p.id}" ${p.id===m.pdv_id?'selected':''}>${escapeHtml(p.nombre)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Monto (COP)</label><input type="number" id="emMonto" min="1" step="1" value="${m.monto}"></div>
      <div class="field"><label>Número de documento</label><input type="text" id="emNumDoc" value="${escapeHtml(m.numero_documento||'')}"></div>
      <div class="field"><label>Descripción</label><textarea id="emDesc">${escapeHtml(m.descripcion||'')}</textarea></div>
      <div class="actions">
        <button class="btn" id="emCancel">Cancelar</button>
        <button class="btn primary" id="emSave">Guardar cambios</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  function refreshOpts(){
    const tipo = $('#emTipo').value;
    const opts = CAT.conceptos.filter(c=>c.tipo===tipo && (c.activo || c.id===m.concepto_id));
    $('#emConcepto').innerHTML = opts.map(c=>`<option value="${c.id}" ${c.id===m.concepto_id?'selected':''}>${escapeHtml(c.nombre)}</option>`).join('');
    refreshCentroOpts();
  }
  function refreshCentroOpts(){
    const conceptoId = $('#emConcepto').value;
    let centros = centrosDeConcepto(conceptoId);
    // conserva el centro actual del movimiento como opción aunque ya no esté asociado al concepto (no perder el dato histórico)
    if(conceptoId === m.concepto_id && !centros.some(c=>c.id===m.centro_costo_id)){
      const actual = CAT.centros.find(c=>c.id===m.centro_costo_id);
      if(actual) centros = [actual, ...centros];
    }
    if(centros.length === 0){
      $('#emCentro').innerHTML = `<option value="">Sin centro de costos asociado</option>`;
    } else {
      $('#emCentro').innerHTML = centros.map(c=>`<option value="${c.id}" ${c.id===m.centro_costo_id?'selected':''}>${escapeHtml(c.nombre)}</option>`).join('');
    }
  }
  $('#emTipo').addEventListener('change', refreshOpts);
  $('#emConcepto').addEventListener('change', refreshCentroOpts);
  refreshOpts();

  $('#emCancel').addEventListener('click', () => overlay.remove());
  $('#emSave').addEventListener('click', async () => {
    const concepto = CAT.conceptos.find(c=>c.id === $('#emConcepto').value);
    const centroId = $('#emCentro').value;
    if(!centroId){ toast('Selecciona un centro de costos.', 'err'); return; }
    const payload = {
      fecha: $('#emFecha').value, tipo: $('#emTipo').value,
      concepto_id: concepto.id, centro_costo_id: centroId,
      pdv_id: $('#emPdv').value, monto: Number($('#emMonto').value),
      numero_documento: $('#emNumDoc').value.trim() || null,
      descripcion: $('#emDesc').value.trim() || null,
      updated_at: new Date().toISOString(), updated_by: currentUser.id,
    };
    if(!payload.monto || payload.monto<=0){ toast('Monto inválido.', 'err'); return; }
    const { error } = await db.from('caja_movimientos').update(payload).eq('id', m.id);
    if(error){ console.error(error); toast('No se pudo actualizar.', 'err'); return; }
    toast('Movimiento actualizado.', 'ok');
    overlay.remove();
    loadHistorial();
  });
}

async function deleteMov(id){
  if(!confirm('¿Eliminar este movimiento? Esta acción no se puede deshacer.')) return;
  const { error } = await db.from('caja_movimientos').delete().eq('id', id);
  if(error){ console.error(error); toast('No se pudo eliminar.', 'err'); return; }
  toast('Movimiento eliminado.', 'ok');
  loadHistorial();
}

// Los traslados son dos filas ligadas (salida/entrada); se eliminan siempre juntas para no dejar la caja descuadrada.
async function deleteTraslado(id){
  const m = histCache.find(x=>x.id===id);
  if(!m) return;
  if(!confirm('¿Eliminar este traslado? Se eliminarán ambos lados (origen y destino). Esta acción no se puede deshacer.')) return;
  const parId = m.traslado_par_id;
  const { error } = await db.from('caja_movimientos').delete().eq('id', id);
  if(error){ console.error(error); toast('No se pudo eliminar el traslado.', 'err'); return; }
  if(parId){
    const { error: e2 } = await db.from('caja_movimientos').delete().eq('id', parId);
    if(e2){ console.error(e2); toast('Se eliminó un lado del traslado, pero el otro no — revísalo en Historial.', 'err'); loadHistorial(); return; }
  }
  toast('Traslado eliminado.', 'ok');
  loadHistorial();
}

function exportHistorialCSV(){
  if(histCache.length===0){ toast('No hay datos para exportar.', 'err'); return; }
  const rows = [['Fecha','Tipo','Concepto','Centro de costos','PDV','Monto','Numero de documento','Descripcion','Usuario']];
  histCache.forEach(m => rows.push([m.fecha, TIPO_LABEL[m.tipo]||m.tipo, movLabel(m), centroName(m.centro_costo_id), pdvName(m.pdv_id), m.monto, m.numero_documento||'', (m.descripcion||'').replace(/\n/g,' '), usuarioName(m.usuario_id)]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(["﻿"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `historial-caja-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ================= CUENTAS Y PRÉSTAMOS =================
   Préstamos a empleados: al registrarlos, restan de la caja (crean un movimiento
   tipo 'prestamo_empleado'). Cuentas por cobrar: no afectan la caja al registrarlas
   (no hubo salida de efectivo). En ambos casos, cada abono/cobro se registra como
   un ingreso normal ligado a la cuenta pendiente, y va bajando su saldo_pendiente. */
let pendFilters = { tipo:'', estado:'' };

function totalPendiente(tipo){
  return CAT.cuentasPendientes.filter(c=>c.tipo===tipo && c.estado!=='pagado').reduce((a,c)=>a+Number(c.saldo_pendiente),0);
}

            <select id="pPdv" required ${scoped ? 'disabled' : ''}>${pdvOptions.map(p=>`<option value="${p.id}" ${scoped && scoped[0]===p.id ? 'selected':''}>${escapeHtml(p.nombre)}</option>`).join('')}</select>
          </div>
        </div>
        <div class="row">
          <div class="col" style="max-width:170px;"><label>Fecha</label><input type="date" id="pFecha" value="${todayISO()}" required></div>

        </div>
        <button class="btn primary" type="submit">Registrar</button>
      </form>
    </div>` : ''}
    <div class="card">
      <div class="row" style="align-items:flex-end;">
        <div class="col" style="max-width:220px;">
          <label>Tipo</label>
          <select id="pfTipo"><option value="">Todos</option><option value="prestamo_empleado">Préstamo a empleado</option><option value="cuenta_por_cobrar">Cuenta por cobrar</option></select>
        </div>
        <div class="col" style="max-width:200px;">
          <label>Estado</label>
          <select id="pfEstado"><option value="">Todos</option><option value="pendiente">Pendiente</option><option value="pagado_parcial">Pagado parcial</option><option value="pagado">Pagado</option></select>
        </div>
        <div class="col" style="max-width:130px;"><button class="btn primary" id="pfApply" style="width:100%;">Filtrar</button></div>
      </div>
    </div>
    <div class="card">
      <div class="tablewrap"><table id="pendTable">
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Deudor</th><th>PDV</th><th class="num">Monto original</th><th class="num">Saldo pendiente</th><th>Estado</th>${canEdit()?'<th>Acciones</th>':''}</tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  `;

  if(canEdit()){
    $('#pTipo').addEventListener('change', () => {
      $('#pDeudorLabel').textContent = $('#pTipo').value === 'prestamo_empleado' ? 'Nombre del empleado' : 'Nombre del cliente / deudor';
    });
    $('#pendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const tipo = $('#pTipo').value;
      const deudor = $('#pDeudor').value.trim();
      const pdv_id = $('#pPdv').value;
      const fecha = $('#pFecha').value;
      const monto = Number($('#pMonto').value);

      const btn = $('#pendForm button[type=submit]');

      const { data: cuenta, error: e1 } = await db.from('caja_cuentas_pendientes')

      await loadCatalogos(); renderPendientes();
    });
  }

  $('#pfApply').addEventListener('click', () => {
    pendFilters = { tipo: $('#pfTipo').value, estado: $('#pfEstado').value };

  });

  renderPendTable();

function renderPendTable(){

  if(!tbody) return;

  const ESTADO_LABEL = {pendiente:'Pendiente', pagado_parcial:'Pagado parcial', pagado:'Pagado'};
  tbody.innerHTML = rows.map(c => `
    <tr>
      <td>${formatDate(c.fecha)}</td>
      <td>${c.tipo==='prestamo_empleado'?'Préstamo a empleado':'Cuenta por cobrar'}</td>
      <td>${escapeHtml(c.deudor)}</td>
      <td>${escapeHtml(pdvName(c.pdv_id))}</td>
      <td class="num">${formatCOP(c.monto_original)}</td>
      <td class="num">${formatCOP(c.saldo_pendiente)}</td>
      <td><span class="pill ${c.estado}">${ESTADO_LABEL[c.estado]}</span></td>
      ${canEdit() ? `<td>
        ${c.saldo_pendiente > 0 ? `<button class="btn sm" data-abono="${c.id}">Registrar abono</button>` : ''}
        <button class="btn sm danger" data-del-pend="${c.id}">Eliminar</button>
      </td>` : ''}
    </tr>`).join('');

  if(canEdit()){
    $$('#pendTable [data-abono]').forEach(b => b.addEventListener('click', () => openAbonoModal(b.dataset.abono)));
    $$('#pendTable [data-del-pend]').forEach(b => b.addEventListener('click', () => deleteCuentaPendiente(b.dataset.delPend)));
  }
}

function openAbonoModal(id){
  const c = CAT.cuentasPendientes.find(x=>x.id===id);
  if(!c) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Registrar abono</h3>
      <div class="sub">${escapeHtml(c.deudor)} — saldo pendiente: ${formatCOP(c.saldo_pendiente)}</div>
      <div class="field"><label>Fecha</label><input type="date" id="abFecha" value="${todayISO()}"></div>
      <div class="field"><label>Monto del abono (COP)</label><input type="number" id="abMonto" min="1" max="${c.saldo_pendiente}" step="1" placeholder="0"></div>
      <div class="field"><label>Descripción (opcional)</label><input type="text" id="abDesc"></div>
      <div class="actions">
        <button class="btn" id="abCancel">Cancelar</button>
        <button class="btn primary" id="abSave">Guardar abono</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  $('#abCancel').addEventListener('click', () => overlay.remove());
  $('#abSave').addEventListener('click', async () => {
    const monto = Number($('#abMonto').value);
    const fecha = $('#abFecha').value;
    const descripcion = $('#abDesc').value.trim() || null;
    if(!monto || monto <= 0){ toast('El monto debe ser mayor a cero.', 'err'); return; }
    if(monto > Number(c.saldo_pendiente)){ toast('El abono no puede ser mayor al saldo pendiente.', 'err'); return; }
    const btn = $('#abSave');
    btn.disabled = true; btn.textContent = 'Guardando…';
    const { error: e1 } = await db.from('caja_movimientos').insert({
      fecha, tipo:'ingreso', pdv_id: c.pdv_id, monto, descripcion,
      usuario_id: currentUser.id, cuenta_pendiente_id: c.id,
    });
    if(e1){ console.error(e1); btn.disabled=false; btn.textContent='Guardar abono'; toast('No se pudo registrar el abono.', 'err'); return; }
    const nuevoSaldo = Number(c.saldo_pendiente) - monto;
    const { error: e2 } = await db.from('caja_cuentas_pendientes').update({
      saldo_pendiente: nuevoSaldo, estado: nuevoSaldo <= 0 ? 'pagado' : 'pagado_parcial', updated_at: new Date().toISOString(),
    }).eq('id', c.id);
    if(e2) console.error(e2);
    overlay.remove();
    toast('Abono registrado.', 'ok');
    await loadCatalogos(); renderPendientes();
  });
}

// Solo permite eliminar si no tiene abonos registrados (si los tuviera, se perdería ese historial de pagos).
async function deleteCuentaPendiente(id){
  const c = CAT.cuentasPendientes.find(x=>x.id===id);
  if(!c) return;
  const nAbonos = await countMovimientosPor('cuenta_pendiente_id', id) - (c.tipo==='prestamo_empleado' ? 1 : 0);
  if(nAbonos > 0){
    alert(`No se puede eliminar: "${c.deudor}" ya tiene ${nAbonos} abono(s) registrados. El historial de pagos no se puede perder.`);
    return;
  }
  if(!confirm(`¿Eliminar el registro de ${c.tipo==='prestamo_empleado'?'préstamo':'cuenta por cobrar'} de "${c.deudor}"? Esta acción no se puede deshacer.`)) return;
  const movimientoId = c.movimiento_id; // capturado antes de anularlo, para no depender del objeto tras el update
  if(movimientoId){
    // rompe primero el vínculo cruzado para poder borrar ambas filas sin violar las FK
    await db.from('caja_cuentas_pendientes').update({ movimiento_id: null }).eq('id', c.id);
    const { error: e1 } = await db.from('caja_movimientos').delete().eq('id', movimientoId);
    if(e1){ console.error(e1); toast('No se pudo eliminar el movimiento del préstamo.', 'err'); return; }
  }
  const { error } = await db.from('caja_cuentas_pendientes').delete().eq('id', c.id);
  if(error){ console.error(error); toast('No se pudo eliminar.', 'err'); return; }
  toast('Registro eliminado.', 'ok');
  await loadCatalogos(); renderPendientes();
}

function centroCheckboxList(name, selectedIds){

    ${activos.map(c=>`<label style="display:flex;align-items:center;gap:6px;font-weight:400;font-size:12.5px;padding:2px 0;">
      <input type="checkbox" value="${c.id}" ${selectedIds.includes(c.id)?'checked':''}> ${escapeHtml(c.nombre)}
    </label>`).join('') || '<span class="empty" style="padding:4px 0;">Sin centros de costo activos</span>'}

function renderCatConceptos(){
  const el = $('#catBody');
  el.innerHTML = `
    <div class="sub" style="margin-bottom:10px;">Marca uno o varios centros de costo por concepto — al registrar un movimiento, esos serán las opciones disponibles.</div>
    <div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Tipo</th><th style="min-width:220px;">Centros de costo asociados</th><th>Estado</th><th></th></tr></thead>
      <tbody>${CAT.conceptos.map(c=>{
        const selected = CAT.conceptoCentros.filter(x=>x.concepto_id===c.id).map(x=>x.centro_costo_id);
        return `
        <tr>
          <td><input type="text" value="${escapeHtml(c.nombre)}" data-name="${c.id}" style="min-width:160px;"></td>
          <td><span class="pill ${c.tipo}">${TIPO_LABEL[c.tipo] || c.tipo}</span></td>
          <td style="max-height:120px;overflow-y:auto;">${centroCheckboxList(c.id, selected)}</td>
          <td><span class="pill ${c.activo?'on':'off'}">${c.activo?'Activo':'Inactivo'}</span></td>
          <td>
            <button class="btn sm" data-save="${c.id}">Guardar</button>
            <button class="btn sm" data-toggle="${c.id}">${c.activo?'Desactivar':'Activar'}</button>
            <button class="btn sm danger" data-del="${c.id}">Eliminar</button>
          </td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>
    <div class="row" style="margin-top:14px;align-items:flex-start;">
      <div class="col" style="max-width:220px;"><input type="text" id="newConName" placeholder="Nuevo concepto…"></div>
      <div class="col" style="max-width:140px;">
        <select id="newConTipo"><option value="ingreso">Ingreso</option><option value="gasto">Salida</option></select>
      </div>
      <div class="col" style="max-width:260px;">
        <label>Centros de costo</label>
        ${centroCheckboxList('new', [])}
      </div>
      <div class="col" style="max-width:140px;"><button class="btn primary" id="addCon" style="width:100%;">Agregar</button></div>
    </div>
  `;
  $$('[data-save]', el).forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.save;
    const row = b.closest('tr');
    const nombre = $(`[data-name="${id}"]`, row).value.trim();
    if(!nombre){ toast('El nombre no puede quedar vacío.', 'err'); return; }
    const checked = $$(`[data-group="${id}"] input[type=checkbox]:checked`, row).map(cb=>cb.value);
    if(checked.length === 0){ toast('Selecciona al menos un centro de costos.', 'err'); return; }
    const c = CAT.conceptos.find(x=>x.id===id);
    if(nombre !== c.nombre){
      const { error: nameErr } = await db.from('caja_conceptos').update({nombre}).eq('id', id);
      if(nameErr){ console.error(nameErr); toast('No se pudo guardar el nombre (¿repetido para ese tipo?).', 'err'); return; }
    }
    const before = CAT.conceptoCentros.filter(x=>x.concepto_id===id).map(x=>x.centro_costo_id);
    const toAdd = checked.filter(cid => !before.includes(cid));
    const toRemove = before.filter(cid => !checked.includes(cid));
    if(toAdd.length){
      const { error } = await db.from('caja_concepto_centro_costo').insert(toAdd.map(centro_costo_id=>({concepto_id:id, centro_costo_id})));
      if(error){ console.error(error); toast('No se pudo guardar.', 'err'); return; }
    }
    for(const centro_costo_id of toRemove){
      const { error } = await db.from('caja_concepto_centro_costo').delete().eq('concepto_id', id).eq('centro_costo_id', centro_costo_id);
      if(error){ console.error(error); toast('No se pudo guardar.', 'err'); return; }
    }
    toast('Guardado.', 'ok'); await loadCatalogos(); renderCatConceptos();
  }));
  $$('[data-toggle]', el).forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.toggle;
    const c = CAT.conceptos.find(x=>x.id===id);
    const { error } = await db.from('caja_conceptos').update({activo: !c.activo}).eq('id', id);
    if(error){ toast('No se pudo actualizar.', 'err'); return; }
    await loadCatalogos(); renderCatConceptos();
  }));
  $$('[data-del]', el).forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.del;
    const c = CAT.conceptos.find(x=>x.id===id);
    const nMov = await countMovimientosPor('concepto_id', id);
    if(nMov !== 0){
      alert(`No se puede eliminar "${c.nombre}": tiene ${nMov} movimiento(s) registrados. Usa "Desactivar" en su lugar para conservar el historial.`);
      return;
    }
    if(!confirm(`¿Eliminar el concepto "${c.nombre}"? Esta acción no se puede deshacer.`)) return;
    const { error } = await db.from('caja_conceptos').delete().eq('id', id);
    if(error){ console.error(error); toast('No se pudo eliminar.', 'err'); return; }
    toast('Concepto eliminado.', 'ok'); await loadCatalogos(); renderCatConceptos();
  }));
  $('#addCon').addEventListener('click', async () => {
    const nombre = $('#newConName').value.trim();
    const tipo = $('#newConTipo').value;
    const centroIds = $$(`[data-group="new"] input[type=checkbox]:checked`, el).map(cb=>cb.value);
    if(!nombre || centroIds.length === 0){ toast('Completa el nombre y selecciona al menos un centro de costos.', 'err'); return; }
    const { data, error } = await db.from('caja_conceptos').insert({nombre, tipo}).select();
    if(error || !data || !data[0]){ console.error(error); toast('No se pudo crear (¿nombre+tipo repetido?).', 'err'); return; }
    const nuevoId = data[0].id;
    const { error: linkErr } = await db.from('caja_concepto_centro_costo').insert(centroIds.map(centro_costo_id=>({concepto_id:nuevoId, centro_costo_id})));
    if(linkErr){ console.error(linkErr); toast('Concepto creado, pero no se pudieron asociar los centros de costo.', 'err'); await loadCatalogos(); renderCatConceptos(); return; }
    toast('Concepto creado.', 'ok'); await loadCatalogos(); renderCatConceptos();
  });
}

async function renderCuenta(){

  main.innerHTML = `
    <div class="card" style="max-width:440px;">
      <h2>Mi cuenta</h2>
      <div class="sub">${escapeHtml(currentUser.nombre)} · ${escapeHtml(currentUser.email)} · ${roleLabel(currentUser.rol)}</div>
      <div id="pwError"></div>
      <div class="field"><label>Contraseña actual</label><input type="password" id="curPass"></div>
      <div class="field"><label>Nueva contraseña</label><input type="password" id="newPass" placeholder="Mín. 8 caracteres"></div>
      <div class="field"><label>Confirmar nueva contraseña</label><input type="password" id="newPass2"></div>
      <button class="btn primary" id="btnChangePw">Actualizar contraseña</button>
    </div>
  `;
  $('#btnChangePw').addEventListener('click', async () => {
    const cur = $('#curPass').value, n1 = $('#newPass').value, n2 = $('#newPass2').value;
    const errBox = $('#pwError'); errBox.innerHTML = '';
    if(n1.length < 8){ errBox.innerHTML = `<div class="error-box">La nueva contraseña debe tener mínimo 8 caracteres.</div>`; return; }
    if(n1 !== n2){ errBox.innerHTML = `<div class="error-box">Las contraseñas nuevas no coinciden.</div>`; return; }
    const { data, error } = await db.from('caja_usuarios').select('password_hash').eq('id', currentUser.id).single();
    if(error){ errBox.innerHTML = `<div class="error-box">No se pudo verificar tu contraseña actual.</div>`; return; }
    const curHash = await sha256Hex(cur);
    if(curHash !== data.password_hash){ errBox.innerHTML = `<div class="error-box">La contraseña actual es incorrecta.</div>`; return; }
    const newHash = await sha256Hex(n1);
    const { error: upErr } = await db.from('caja_usuarios').update({password_hash:newHash}).eq('id', currentUser.id);
    if(upErr){ errBox.innerHTML = `<div class="error-box">No se pudo actualizar la contraseña.</div>`; return; }
    toast('Contraseña actualizada.', 'ok');
    $('#curPass').value=''; $('#newPass').value=''; $('#newPass2').value='';
  });
}

/* ================= BOOT ================= */
(async function boot(){
  const saved = loadSessionFromStorage();
  if(saved){
    currentUser = saved;
    await loadCatalogos();
    // re-validate the user is still active
    const stillActive = CAT.usuarios.find(u => u.id === currentUser.id && u.activo);
    if(!stillActive){ clearSession(); currentUser = null; }
  }
  route();
})();
